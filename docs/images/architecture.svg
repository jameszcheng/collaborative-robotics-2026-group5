<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#58a6ff"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#3fb950"/>
    </marker>
    <marker id="arr-green-up" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L8,3 L0,6" fill="#3fb950"/>
    </marker>
    <marker id="arr-orange" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#d29922"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#f85149"/>
    </marker>
    <marker id="arr-dim" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#484f58"/>
    </marker>
    <marker id="arr-legend" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#c9d1d9"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="12" fill="#0d1117"/>
  <rect x="1" y="1" width="898" height="518" rx="12" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" fill="#f0f6fc" font-size="15" font-weight="700">End-to-End Data Flow</text>
  <text x="450" y="54" text-anchor="middle" fill="#484f58" font-size="11">ROS2 topics shown on arrows</text>

  <!-- ==================== NODES ==================== -->

  <!-- User -->
  <rect x="50" y="80" width="120" height="50" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="110" y="101" text-anchor="middle" fill="#f0f6fc" font-size="12" font-weight="600">User</text>
  <text x="110" y="118" text-anchor="middle" fill="#8b949e" font-size="10">Voice / Text</text>

  <!-- NLP Node -->
  <rect x="240" y="80" width="160" height="50" rx="8" fill="#0d2035" stroke="#1f6feb66"/>
  <text x="320" y="101" text-anchor="middle" fill="#58a6ff" font-size="12" font-weight="600">NLP Interface</text>
  <text x="320" y="118" text-anchor="middle" fill="#8b949e" font-size="10">Gemini parsing</text>

  <!-- Coordinator (wide, spanning above all three child nodes) -->
  <rect x="100" y="200" width="680" height="60" rx="8" fill="#0d2035" stroke="#1f6feb" stroke-width="2"/>
  <text x="440" y="225" text-anchor="middle" fill="#58a6ff" font-size="14" font-weight="700">Coordinator</text>
  <text x="440" y="244" text-anchor="middle" fill="#8b949e" font-size="10">Task 1 / Task 2 / Task 3 state machine</text>

  <!-- Perception Node (below left of coordinator) -->
  <rect x="100" y="340" width="180" height="60" rx="8" fill="#162312" stroke="#3fb95066"/>
  <text x="190" y="364" text-anchor="middle" fill="#3fb950" font-size="12" font-weight="600">Perception</text>
  <text x="190" y="382" text-anchor="middle" fill="#8b949e" font-size="10">YOLOv11 / HSV detector</text>

  <!-- Navigation Node (below center of coordinator) -->
  <rect x="350" y="340" width="180" height="60" rx="8" fill="#2d1f00" stroke="#d2992266"/>
  <text x="440" y="364" text-anchor="middle" fill="#d29922" font-size="12" font-weight="600">Navigation</text>
  <text x="440" y="382" text-anchor="middle" fill="#8b949e" font-size="10">Proportional controller</text>

  <!-- Pickup Node (below right of coordinator) -->
  <rect x="600" y="340" width="180" height="60" rx="8" fill="#2d1115" stroke="#f8514966"/>
  <text x="690" y="364" text-anchor="middle" fill="#f85149" font-size="12" font-weight="600">Pickup</text>
  <text x="690" y="382" text-anchor="middle" fill="#8b949e" font-size="10">Arm control + gripper</text>

  <!-- Camera (below perception) -->
  <rect x="100" y="460" width="180" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="190" y="485" text-anchor="middle" fill="#8b949e" font-size="11">RealSense D435</text>

  <!-- Base (below navigation) -->
  <rect x="350" y="460" width="180" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="440" y="485" text-anchor="middle" fill="#8b949e" font-size="11">Mobile Base</text>

  <!-- Arms (below pickup) -->
  <rect x="600" y="460" width="180" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="690" y="485" text-anchor="middle" fill="#8b949e" font-size="11">WX250s Arms + Grippers</text>

  <!-- ==================== ARROWS ==================== -->

  <!-- User → NLP -->
  <line x1="170" y1="105" x2="235" y2="105" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- NLP → Coordinator (down, left channel) -->
  <line x1="300" y1="130" x2="300" y2="195" stroke="#58a6ff" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="292" y="168" fill="#58a6ff" font-size="9" text-anchor="end">/nlp/response</text>

  <!-- Coordinator → NLP (up, right channel, dashed) -->
  <line x1="340" y1="200" x2="340" y2="135" stroke="#58a6ff" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="348" y="168" fill="#58a6ff" font-size="8" opacity="0.6">/coordinator/status</text>

  <!-- Coordinator → Perception (down, left parallel line) -->
  <line x1="170" y1="260" x2="170" y2="335" stroke="#3fb950" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="125" y="300" fill="#3fb950" font-size="9">/target_label</text>

  <!-- Perception → Coordinator (up, right parallel line, dashed) -->
  <line x1="210" y1="340" x2="210" y2="265" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="218" y="300" fill="#3fb950" font-size="9" opacity="0.7">/object_pose</text>

  <!-- Coordinator → Navigation (down, left channel) -->
  <line x1="420" y1="260" x2="420" y2="335" stroke="#d29922" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="370" y="300" fill="#d29922" font-size="9">/nav_goal</text>

  <!-- Navigation → Coordinator (up, right channel, dashed) -->
  <line x1="460" y1="340" x2="460" y2="265" stroke="#d29922" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-orange)"/>
  <text x="468" y="300" fill="#d29922" font-size="9" opacity="0.7">/nav_complete</text>

  <!-- Coordinator → Pickup (down, left channel) -->
  <line x1="670" y1="260" x2="670" y2="335" stroke="#f85149" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="614" y="300" fill="#f85149" font-size="9">/pickup_trigger</text>

  <!-- Pickup → Coordinator (up, right channel, dashed) -->
  <line x1="710" y1="340" x2="710" y2="265" stroke="#f85149" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="718" y="300" fill="#f85149" font-size="9" opacity="0.7">/pickup_complete</text>

  <!-- Camera → Perception (hardware, dim) -->
  <line x1="190" y1="460" x2="190" y2="405" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="198" y="438" fill="#484f58" font-size="8">RGB + Depth</text>

  <!-- Navigation → Base (hardware, dim) -->
  <line x1="440" y1="400" x2="440" y2="455" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="448" y="435" fill="#484f58" font-size="8">/cmd_vel</text>

  <!-- Pickup → Arms (hardware, dim) -->
  <line x1="690" y1="400" x2="690" y2="455" stroke="#484f58" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <text x="698" y="435" fill="#484f58" font-size="8">joint + gripper cmds</text>

  <!-- ==================== LEGEND ==================== -->
  <rect x="620" y="75" width="250" height="90" rx="6" fill="#161b22" stroke="#21262d"/>
  <text x="635" y="95" fill="#8b949e" font-size="10" font-weight="600">Legend</text>
  <line x1="635" y1="112" x2="665" y2="112" stroke="#c9d1d9" stroke-width="1.5" marker-end="url(#arr-legend)"/>
  <text x="672" y="116" fill="#8b949e" font-size="9">Command / trigger</text>
  <line x1="635" y1="132" x2="665" y2="132" stroke="#c9d1d9" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arr-legend)"/>
  <text x="672" y="136" fill="#8b949e" font-size="9">Feedback / status</text>
  <rect x="635" y="146" width="12" height="12" rx="2" fill="#0d2035" stroke="#1f6feb66"/>
  <text x="654" y="157" fill="#8b949e" font-size="9">ROS2 node</text>
</svg>